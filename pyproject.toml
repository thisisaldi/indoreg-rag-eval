[project]
name = "indoreg"
version = "0.1.0"
description = "Evaluation-first retrieval benchmark over Indonesian regulations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.3",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dense = [
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
# Keep ruff away from code blocks in the Markdown specs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# Optional `dense` extra: absent in CI, and not worth type-checking through torch.
[[tool.mypy.overrides]]
module = ["sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
follow_imports = "skip"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

# CPU-only torch on Linux (WSL, Docker); the Windows PyPI wheel is already CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
