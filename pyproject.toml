[project]
name = "indoreg"
version = "0.1.0"
description = "Evaluation-first retrieval benchmark over Indonesian regulations"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.161.1",
    "huggingface-hub>=2.2.0",
    "numpy>=2.3",
    "onnxruntime>=1.31.0",
    "pdfplumber>=0.11.10",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyyaml>=6.0.3",
    "tokenizers>=0.23.3",
    "uvicorn>=0.54.0",
]

# Vercel deployment (T-35, ADR-016): module-level app and a build step that
# bakes the model and embeddings into the function.
[tool.vercel]
entrypoint = "src.vercel_app:app"

[tool.vercel.scripts]
build = "python scripts/vercel_build.py"

[build-system]
requires = ["uv_build>=0.12.7,<0.13"]
build-backend = "uv_build"

[tool.ruff]
target-version = "py311"
src = ["src", "tests"]
# Keep ruff away from code blocks in the Markdown specs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

# onnxruntime ships no type information.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

