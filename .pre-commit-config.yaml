# Hook revisions checked against GitHub releases on 22 Oct 2026:
#   ruff-pre-commit v0.17.1 (published 2026-10-15), gitleaks v8.30.1 (published 2026-03-21).
# The gitleaks hook builds from source and needs a Go toolchain on PATH.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks
