# Default configuration. Override any key with an INDOREG_ environment variable,
# nested keys joined by "__", e.g. INDOREG_CHUNKING__FIXED__SIZE_CHARS=800.
# Values are starting points, not decisions (design.md section 6).

paths:
  raw: data/raw
  manifest: data/manifest.json
  dataset: eval/dataset.jsonl
  processed: data/processed
  chunks: data/chunks
  cache: data/cache
  models: data/models
  results: reports/results

chunking:
  fixed:
    size_chars: 1200
    overlap_chars: 200

logging:
  level: INFO
  log_query_text: false

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
  # Named variants; eval and search refer to these names (design.md 4.3).
  retrievers:
    bm25-basic: {type: bm25, preprocess: basic, index_title: false}
    bm25-id: {type: bm25, preprocess: id, index_title: false}
    bm25-id-title: {type: bm25, preprocess: id, index_title: true}
    # Official int8 ONNX export, run with onnxruntime (ADR-006, ADR-016).
    dense-e5-small:
      type: dense
      model: intfloat/multilingual-e5-small
      revision: 614241f622f53c4eeff9890bdc4f31cfecc418b3
      onnx_file: onnx/model_qint8_avx512_vnni.onnx
      query_prefix: "query: "
      passage_prefix: "passage: "
      max_seq_length: 512
      batch_size: 16
    dense-e5-base:
      type: dense
      model: intfloat/multilingual-e5-base
      revision: d128750597153bb5987e10b1c3493a34e5a4502a
      onnx_file: onnx/model_qint8_avx512_vnni.onnx
      query_prefix: "query: "
      passage_prefix: "passage: "
      max_seq_length: 512
      batch_size: 16

    # RRF over the best dev BM25 variant and the chosen dense model (ADR-006);
    # k and depth kept at the design default after the dev-only grid (T-18).
    hybrid: {type: hybrid, members: [bm25-id-title, dense-e5-small], rrf_k: 60, depth: 50}
search:
  default_top_k: 5
  max_top_k: 20
  max_query_chars: 500
  cors_origins: ["https://naufaldi.vercel.app"]  # T-35
  retriever: hybrid  # ADR-018
  strategy: article

eval:
  retrievers: [bm25-basic, bm25-id, bm25-id-title, dense-e5-small, dense-e5-base, hybrid]
  strategies: [article, fixed]
  baseline: bm25-basic/article
  # Extra paired comparisons [run, reference], e.g. to pick the dense model.
  pairs:
    - [dense-e5-base/article, dense-e5-small/article]
    - [hybrid/article, bm25-id-title/article]
    - [hybrid/article, dense-e5-small/article]
  bootstrap: {iterations: 1000, seed: 42, confidence: 0.95}
  splits: [dev, test]
  recall_ks: [5, 10]
  ndcg_k: 10
  depth: 20
